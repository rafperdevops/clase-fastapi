<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión de Estudiantes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Estudiantes</h1>
        
        <div class="card" id="step-email">
            <h2>Iniciar Sesión</h2>
            <p style="margin-bottom: 15px; color: #666;">Ingresa tu correo electrónico para recibir un código de verificación.</p>
            <form id="email-form">
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-actions">
                    <button type="submit" id="request-btn">Enviar Código</button>
                </div>
            </form>
            <div id="email-message" class="message"></div>
        </div>

        <div class="card" id="step-otp" style="display: none;">
            <h2>Verificar Código</h2>
            <p style="margin-bottom: 15px; color: #666;">Se envió un código de 6 dígitos a tu correo.</p>
            <form id="otp-form">
                <div class="form-group">
                    <label for="otp">Código OTP:</label>
                    <input type="text" id="otp" name="otp" required maxlength="6" pattern="[0-9]{6}">
                </div>
                <div class="form-actions">
                    <button type="submit" id="verify-btn">Verificar</button>
                    <button type="button" id="reset-btn" class="btn-cancel">Cambiar Correo</button>
                </div>
            </form>
            <div id="otp-message" class="message"></div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
